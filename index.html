<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientist#Cplay Stats</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .tag { color: #888; margin-bottom: 30px; font-size: 1.1em; }

        /* --- RANK SECTION --- */
        .rank-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .rank-card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 220px; text-align: center; border: 1px solid #333; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .rank-card h3 { margin: 0 0 10px 0; color: #aaa; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        
        .tier-icon { width: 80px; height: 80px; margin-bottom: 10px; }
        .tier-text { font-size: 1.5em; font-weight: bold; color: #fff; }
        .lp-text { color: #888; font-size: 0.9em; margin-bottom: 15px; }
        
        .winrate { font-size: 0.85em; padding: 5px 10px; background: #252525; border-radius: 4px; display: inline-block; }
        .win-text { color: #2ecc71; }
        .loss-text { color: #e74c3c; }

        /* --- MATCH HISTORY SECTION --- */
        .match-list { width: 100%; max-width: 500px; }
        .card { padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #555; background: #1e1e1e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card.win { border-left-color: #2ecc71; background: linear-gradient(90deg, #1e1e1e, rgba(46, 204, 113, 0.05)); }
        .card.loss { border-left-color: #e74c3c; background: linear-gradient(90deg, #1e1e1e, rgba(231, 76, 60, 0.05)); }
        .champ { font-size: 1.2rem; font-weight: bold; }
        .kda { font-size: 1.1rem; font-weight: bold; color: #ddd; }
        .details { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Scientist</h1>
    <div class="tag">#Cplay (SEA)</div>

    <div class="rank-container">
        <div class="rank-card" id="solo-card">
            <h3>Ranked Solo</h3>
            <div id="solo-content">Loading...</div>
        </div>
        <div class="rank-card" id="flex-card">
            <h3>Ranked Flex</h3>
            <div id="flex-content">Loading...</div>
        </div>
    </div>

    <div class="match-list" id="match-list">
        <div style="text-align:center; color:#555;">Loading Match History...</div>
    </div>

    <script>
        // Helper to generate Rank HTML
        function renderRank(data, elementId) {
            const container = document.getElementById(elementId);
            if (!data) {
                container.innerHTML = "<p style='color:#555; margin-top:30px;'>Unranked</p>";
                return;
            }

            const tier = data.tier.toLowerCase(); // e.g., 'emerald'
            const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${tier}.png`;
            const winRate = Math.round((data.wins / (data.wins + data.losses)) * 100);

            container.innerHTML = `
                <img src="${iconUrl}" class="tier-icon" alt="${data.tier}">
                <div class="tier-text">${data.tier} ${data.rank}</div>
                <div class="lp-text">${data.leaguePoints} LP</div>
                <div class="winrate">
                    <span class="win-text">${data.wins}W</span> / <span class="loss-text">${data.losses}L</span>
                    <br>
                    <span style="color:#ddd;">${winRate}% WR</span>
                </div>
            `;
        }

        window.onload = async () => {
            // 1. Fetch Rank
            try {
                const rankRes = await fetch('http://localhost:3000/api/my-rank');
                const rankData = await rankRes.json();
                
                if (rankData.error) {
                    console.error(rankData.error);
                    document.getElementById('solo-content').innerHTML = "Error loading rank";
                } else {
                    renderRank(rankData.solo, 'solo-content');
                    renderRank(rankData.flex, 'flex-content');
                }
            } catch (e) { console.error("Rank Error", e); }

            // 2. Fetch History (Same as before)
            try {
                const histRes = await fetch('http://localhost:3000/api/my-history');
                const matches = await histRes.json();
                const list = document.getElementById('match-list');
                list.innerHTML = ""; // Clear loader

                matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `card ${m.win ? 'win' : 'loss'}`;
                    div.innerHTML = `
                        <div>
                            <div class="champ">${m.champion}</div>
                            <div class="details">${m.mode}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="kda">${m.kills} / ${m.deaths} / ${m.assists}</div>
                            <div class="details">CS: ${m.cs} • KDA: ${m.kda}</div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) { console.error("History Error", e); }
        };
    </script>
</body>
</html>
